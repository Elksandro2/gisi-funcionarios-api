services:
  db:
    image: postgres:16
    container_name: funcionarios-db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=gestao_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_gisi:/var/lib/postgresql/data
    networks:
      - postgres_network_gisi
  
  pgadmin:
    image: dpage/pgadmin4
    container_name: gestao-gisi-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "9000:80"
    volumes:
      - pgadmin_data_gisi:/var/lib/pgadmin
    networks:
      - postgres_network_gisi

  api:
    build: .
    container_name: funcionarios-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/gestao_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=123456
      - SERVER_PORT=8080
    depends_on:
      - db
    networks:
      - postgres_network_gisi

volumes:
  postgres_data_gisi:
  pgadmin_data_gisi:

networks:
  postgres_network_gisi:
    driver: bridge