name: CI/CD Pipeline - Produção

on:
  push:
    branches:
      - main
      - master

env:
  COMPOSE_PATH: /app/gisi-api

jobs:
  # ── 1. Build, Test & Push ───────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build com Maven (Gera o .jar)
        run: mvn clean package -DskipTests

      - name: Autentica no GitHub Container Registry (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Constrói a imagem Docker e envia para o GHCR
        run: |
          # Transforma o nome do usuário/repositório 100% em letras minúsculas dinamicamente
          LOWER_IMAGE_NAME=$(echo "ghcr.io/${{ github.repository_owner }}/gisi-funcionarios-api:latest" | tr '[:upper:]' '[:lower:]')

          docker build -t $LOWER_IMAGE_NAME .
          docker push $LOWER_IMAGE_NAME

  # ── 2. Deploy no Servidor ───────────────────────────────────────────────────
  deploy:
    name: Deploy na DigitalOcean
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Conecta via SSH e Atualiza os Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ env.COMPOSE_PATH }}

            # Força o nome da imagem para minúsculas dentro do ambiente do seu servidor também
            LOWER_IMAGE_NAME=$(echo "ghcr.io/${{ github.repository_owner }}/gisi-funcionarios-api:latest" | tr '[:upper:]' '[:lower:]')

            # O servidor faz o login seguro para ler o pacote privado gerado pelo repositório
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Modifica dinamicamente o arquivo compose do servidor para usar a imagem pronta do GHCR em vez de tentar compilar
            sed -i "s|build:|image: $LOWER_IMAGE_NAME #build:|g" docker-compose.prod.yml

            # Puxa a nova versão da imagem silenciosamente e levanta os serviços atualizados
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            # Remove imagens antigas ou corrompidas para economizar o armazenamento do seu SSD
            docker image prune -af
