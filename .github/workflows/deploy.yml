name: CI/CD Pipeline - Produção

on:
  push:
    branches:
      - main
      - master

# Define o nome da imagem convertendo o nome do repositório para minúsculas
env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gisi-funcionarios-api:latest
  COMPOSE_PATH: /app/gisi-api

jobs:
  # ── 1. Build, Test & Push ───────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Necessário para empurrar a imagem para o GitHub Packages

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build com Maven (Gera o .jar)
        run: mvn clean package -DskipTests

      - name: Autentica no GitHub Container Registry (GHCR)
        # Usa o token automático do próprio GitHub, sem precisar configurar senhas
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Constrói a imagem Docker e envia para o GHCR
        run: |
          docker build -t ${{ env.IMAGE_NAME }} .
          docker push ${{ env.IMAGE_NAME }}

  # ── 2. Deploy no Servidor ───────────────────────────────────────────────────
  deploy:
    name: Deploy na DigitalOcean
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Conecta via SSH e Atualiza os Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ env.COMPOSE_PATH }}
            
            # O servidor precisa fazer login no GHCR para conseguir baixar a imagem privada
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Ajuste dinâmico: garante que o compose do servidor use a imagem que acabamos de subir
            sed -i 's|build:|image: ${{ env.IMAGE_NAME }} #build:|g' docker-compose.prod.yml
            
            # Baixa a imagem nova levemente
            docker compose -f docker-compose.prod.yml pull
            
            # Reinicia o container usando a nova imagem, sem derrubar o serviço
            docker compose -f docker-compose.prod.yml up -d
            
            # Limpa imagens antigas não utilizadas para liberar espaço no disco
            docker image prune -af